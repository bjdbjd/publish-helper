name: Release Build

# 打出 Windows / macOS / Linux 三平台产物并挂到 Release。
#
# 为什么必须用 CI：PyInstaller **不能跨平台编译**。Windows 上无法产出
# macOS 的 .app（涉及 Mach-O 与签名），也无法产出 Linux 可执行文件。
# 推 tag 触发本工作流，三个 runner 各自native构建后汇总上传。
#
# 触发方式：
#   1) 推 tag：   git tag v2.0.0 && git push origin v2.0.0
#   2) 手动：     Actions → Release Build → Run workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建/发布的 tag（留空则用当前 ref）。用于重跑既有 tag 的 Release，无需强推 tag。'
        required: false
        default: ''
      upload_release:
        description: '构建后创建/更新 GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            artifact: 'Publish Helper.exe'
          - os: macos-latest
            label: macos-arm64
            artifact: 'Publish Helper.app'
          - os: ubuntu-22.04
            label: linux-x64
            artifact: 'Publish Helper'

    steps:
      # 显式指定 ref：手动 dispatch 带 tag 入参时构建的是那个 tag 的代码，
      # 而不是触发时所在分支的顶端。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.5.0"

      # Linux 上 MediaInfo 需系统库；Windows/macOS 由 pymediainfo 自带或用系统库
      - name: Install libmediainfo (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Check-Valid-Until=false
          sudo apt-get install -y libmediainfo0v5 libzen0v5

      # Linux 无显示环境，Qt 需要这些运行库才能通过打包期依赖解析
      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3

      - name: Build
        run: python packaging/make_release.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' || inputs.upload_release
    runs-on: ubuntu-latest
    steps:
      # 说明正文取**默认分支**，而不是 tag：tag 是不可变的，若说明里有格式
      # 问题（例如曾出现的 CRLF 被渲染成字面 "\n"），改 tag 就得强推 ref。
      # 二进制产物不来自 checkout，而是下面的 download-artifact，
      # 因此这里用默认分支不会让产物与 tag 脱节。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected assets
        run: ls -la artifacts/

      - name: Fail loudly if release notes are missing
        run: |
          test -s packaging/RELEASE_NOTES.md || {
            echo "::error::packaging/RELEASE_NOTES.md 缺失或为空，拒绝创建空说明的 Release"; exit 1; }

      - name: Reject CRLF in release notes
        run: |
          if grep -qU $'\r' packaging/RELEASE_NOTES.md; then
            echo "::error::RELEASE_NOTES.md 含 CRLF，GitHub 会把 CR 渲染成字面 \\n。请改为 LF 后重跑。"
            exit 1
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name 用入参（手动重跑既有 tag 的场景），否则用触发 ref。
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Publish Helper ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          draft: true
          generate_release_notes: false
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

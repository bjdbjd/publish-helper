name: Docker Image

# 构建并推送统一镜像（Vue 前端 + Flask API + nginx）到 GHCR。
#
# 与 release.yml 的分工：
#   - release.yml：PyInstaller 三平台桌面产物 → GitHub Release（桌面用户）
#   - 本工作流：统一容器镜像 → ghcr.io（服务器/自托管用户）
# 两者互不依赖，可各自单独触发。
#
# 触发方式：
#   1) 推 tag：  git tag v2.0.2 && git push origin v2.0.2
#   2) 手动：    Actions → Docker Image → Run workflow
#
# 镜像名：ghcr.io/bjdbjd/publish-helper（公开，随仓库可见性）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（留空则用当前 ref）'
        required: false
        default: ''
      push:
        description: '构建后推送到 ghcr.io'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 统一镜像要同时编入后端与前端，故两个仓库都必须 checkout。
      # 布局必须与本地一致（同级目录），Dockerfile 里按 publish-helper/ 与
      # publish-helper-vue/ 两个相对路径 COPY。
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: publish-helper

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: bjdbjd/publish-helper-vue
          # 前端用固定 ref；要跟随前端最新 main 就把下面这行删掉
          ref: main
          path: publish-helper-vue

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成 tag 列表：版本号（如 2.0.2 / v2.0.2）+ latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # context 是两仓库的公共父目录（与本地布局一致）。
      # .dockerignore 用 deploy/Dockerfile.dockerignore（BuildKit 会自动识别）。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: publish-helper/deploy/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 国内 runner 可改镜像源；默认官方源
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
            VITE_API_AUTH_TOKEN=

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
